name: Monitoring Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  ping:
    name: Trigger monitoring ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl --silent --show-error --fail \
            --max-time 30 \
            "${{ secrets.BACKEND_URL }}/api/v1/monitoring/jobs/ping"
